name: Samaa
options:
  bundleIdPrefix: com.mehdi
  deploymentTarget:
    iOS: "16.0"
targets:
  Samaa:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Samaa
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60@2x, AppIcon60x60@3x]
            CFBundleIconName: AppIcon
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon76x76@2x, AppIcon83.5x83.5@2x]
            CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehdi.samaa
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Samaa:
    build:
      targets:
        Samaa: all
