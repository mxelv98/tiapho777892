name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SawtiIOS/**'
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: SawtiIOS
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Sawti.xcodeproj -scheme Sawti \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Sawti.app Payload/
          zip -qr Sawti.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Sawti-unsigned-ipa
          path: SawtiIOS/Sawti.ipa
