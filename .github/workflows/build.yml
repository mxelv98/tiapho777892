name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run tests
        run: |
          set -o pipefail
          # Pick any available iPhone simulator; create one if the
          # runner image ships none (seen on macos-15, run #27: the
          # fixed "iPhone 16, OS=latest" destination matched nothing).
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' || true)
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes | grep -Eo 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
            DEVTYPE=$(xcrun simctl list devicetypes | grep -E 'iPhone' | tail -1 | grep -Eo 'com.apple.CoreSimulator.SimDeviceType.[A-Za-z0-9-]+')
            echo "No simulator found — creating $DEVTYPE on $RUNTIME"
            UDID=$(xcrun simctl create TiaTest "$DEVTYPE" "$RUNTIME")
          fi
          echo "Test destination simulator: $UDID"
          xcodebuild test -project TiaPhone.xcodeproj -scheme TiaPhone \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/testlog.txt
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/testlog.txt
      - name: Build (unsigned)
        run: |
          xcodebuild -project TiaPhone.xcodeproj -scheme TiaPhone \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TiaPhone.app Payload/
          zip -qr TiaPhone.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TiaPhone-unsigned-ipa
          path: TiaPhone.ipa
