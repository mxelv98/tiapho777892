name: TiaPhone
options:
  bundleIdPrefix: com.mehdi
  deploymentTarget:
    iOS: "16.0"
targets:
  TiaPhone:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Tia Phone
        CFBundleShortVersionString: "5.1"
        CFBundleVersion: "11"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60@2x, AppIcon60x60@3x]
            CFBundleIconName: AppIcon
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon76x76@2x, AppIcon83.5x83.5@2x]
            CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehdi.tiaphone
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TiaPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TiaPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehdi.tiaphone.tests
        SWIFT_VERSION: "5.0"
schemes:
  TiaPhone:
    build:
      targets:
        TiaPhone: all
    test:
      targets:
        - TiaPhoneTests
